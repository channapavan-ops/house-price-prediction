<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <link rel="stylesheet" href="app_style.css">

</head>


<body>


    <div class="container">


        <h1>
            House Price Prediction
        </h1>


        <p class="subtitle">
            Enter the details of the house
        </p>


        <form id="predictionForm">


            <label>
                Area (sq.ft)
            </label>

            <input
                type="number"
                id="area"
                placeholder="Example: 1500"
                required
            >


            <label>
                Bedrooms
            </label>

            <input
                type="number"
                id="bedrooms"
                placeholder="Example: 3"
                min="1"
                required
            >


            <label>
                Bathrooms
            </label>

            <input
                type="number"
                id="bathrooms"
                placeholder="Example: 2"
                min="1"
                required
            >


            <label>
                Stories
            </label>

            <input
                type="number"
                id="stories"
                placeholder="Example: 2"
                min="1"
                required
            >


            <label>
                Parking Spaces
            </label>

            <input
                type="number"
                id="parking"
                placeholder="Example: 1"
                min="0"
                required
            >


            <button type="submit">
                Predict Price
            </button>


        </form>


        <div id="result"></div>


    </div>


    <script src="app_script.js"></script>


</body>

</html>
